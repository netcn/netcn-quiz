<script>
/* 界面级双语：只翻译界面文案，题目与答案保持中文（汉字谐音/拆字不适合翻译） */
(function () {
  'use strict';
  var I18N = {
    zh: {
      brand: '头脑体操', nav: '导航', ask: '科学问答', quiz: '头脑体操', game: '玩游戏',
      searchPh: '搜索题目…（回车定位）',
      t1: '脑筋急转弯', t2: '猜字谜', t3: '猜谜语', t4: '智力测试',
      statsOf: '第', statsUnit: '题', prev: '◀ 上一题', show: '显示答案', hide: '隐藏答案', next: '随机下一题 ▶',
      loading: '加载中...', noMatch: '没有找到匹配的题目，换个词试试。',
      footNote: '© 2011-2026 头脑体操 quiz.netcn.org',
      footSite: '3,193 题 · 脑筋急转弯 / 字谜 / 谜语 / 智力测试',
      cnNote: ''
    },
    en: {
      brand: 'Brain Teasers', nav: 'Nav', ask: 'Science Q&A', quiz: 'Brain Teasers', game: 'Games',
      searchPh: 'Search questions...',
      t1: 'Brain Teasers', t2: 'Character Riddles', t3: 'Riddles', t4: 'IQ Test',
      statsOf: '', statsUnit: '', prev: '◀ Prev', show: 'Show answer', hide: 'Hide answer', next: 'Random next ▶',
      loading: 'Loading...', noMatch: 'No matching question. Try another word.',
      footNote: '© 2011-2026 Brain Teasers quiz.netcn.org',
      footSite: '3,193 questions · Brain teasers / character riddles / riddles / IQ test',
      cnNote: 'Chinese wordplay: these riddles rely on homophones and character structure, so questions and answers stay in Chinese. The interface is fully in English.'
    }
  };
  var allData = window.allQuizData || {};
  var lang = localStorage.getItem('lang') === 'en' ? 'en' : 'zh';
  /* 用 !== undefined 判断，避免空字符串文案（如中文态的汉字题说明）
     被 || 链误判为缺键而回退成键名 */
  function t(k) {
    var v = I18N[lang][k];
    if (v === undefined) v = I18N.zh[k];
    return v === undefined ? k : v;
  }

  var filtered = [], idx = 0, vis = false, hist = [], curType = 'njjzw';
  var tabs = document.querySelectorAll('.quiz-tab');
  var title = document.getElementById('quizTitle');
  var cn = document.getElementById('currentNum');
  var tn = document.getElementById('totalNum');
  var ct = document.getElementById('categoryTag');
  var q = document.getElementById('question');
  var a = document.getElementById('answer');
  var ba = document.getElementById('btnAnswer');
  var bn = document.getElementById('btnNext');
  var bp = document.getElementById('btnPrev');
  var search = document.getElementById('quizSearch');
  var TITLE_KEY = { njjzw: 't1', zimi: 't2', miyu: 't3', iq: 't4' };

  function shuffle(arr) {
    var r = arr.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = r[i]; r[i] = r[j]; r[j] = tmp;
    }
    return r;
  }
  function syncAnswerBtn() {
    ba.textContent = t(vis ? 'hide' : 'show');
    ba.classList.toggle('hide-answer', vis);
  }
  function show(i) {
    if (!filtered.length) return;
    if (i < 0) i = filtered.length - 1;
    if (i >= filtered.length) i = 0;
    idx = i;
    var d = filtered[idx];
    ct.textContent = d.c;
    q.textContent = d.q;
    a.textContent = d.a;
    a.classList.remove('show');
    vis = false;
    syncAnswerBtn();
    cn.textContent = idx + 1;
    tn.textContent = filtered.length;
  }
  function doSearch() {
    var kw = search.value.trim();
    var pool = allData[curType] || [];
    if (!kw) { filtered = shuffle(pool); hist = []; show(0); return; }
    filtered = pool.filter(function (x) {
      return (x.q || '').indexOf(kw) >= 0 || (x.a || '').indexOf(kw) >= 0;
    });
    hist = [];
    if (filtered.length) { show(0); return; }
    ct.textContent = '';
    q.textContent = t('noMatch');
    a.textContent = '';
    a.classList.remove('show');
    vis = false;
    syncAnswerBtn();
    cn.textContent = '0'; tn.textContent = '0';
  }
  function switchType(type) {
    curType = type;
    title.textContent = t(TITLE_KEY[type]);
    tabs.forEach(function (tab) { tab.classList.toggle('active', tab.dataset.type === type); });
    filtered = shuffle(allData[type] || []);
    hist = [];
    show(0);
    if (search.value.trim()) doSearch();
  }
  function applyLang(l) {
    lang = l === 'en' ? 'en' : 'zh';
    document.querySelectorAll('[data-i18n]').forEach(function (el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
      el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph')));
    });
    title.textContent = t(TITLE_KEY[curType]);
    syncAnswerBtn();
    if (!filtered.length) q.textContent = t('noMatch');
    /* 汉字题说明只在 EN 界面出现；中文界面不留空占位 */
    var note = document.getElementById('quizCnNote');
    if (note) note.hidden = !note.textContent.trim();
  }

  tabs.forEach(function (tab) {
    tab.querySelector('.cnt').textContent = ' ' + (allData[tab.dataset.type] || []).length;
    tab.addEventListener('click', function () { switchType(this.dataset.type); });
  });
  ba.addEventListener('click', function () {
    vis = !vis;
    a.classList.toggle('show', vis);
    syncAnswerBtn();
  });
  bn.addEventListener('click', function () {
    if (!filtered.length) return;
    hist.push(idx);
    var n;
    do { n = Math.floor(Math.random() * filtered.length); } while (n === idx && filtered.length > 1);
    show(n);
  });
  bp.addEventListener('click', function () { if (hist.length) show(hist.pop()); });
  var searchTimer = null;
  search.addEventListener('input', function () {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(doSearch, 120);
  });
  search.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doSearch(); } });
  document.addEventListener('keydown', function (e) {
    var tag = ((e.target && e.target.tagName) || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (e.key === ' ') { e.preventDefault(); ba.click(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); bn.click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); bp.click(); }
  });
  document.addEventListener('ncn:lang', function (e) { applyLang(e.detail.lang); });

  applyLang(lang);
  switchType('njjzw');
})();
</script>
